version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION}
    container_name: gitlab
    restart: always
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.vr-worlds.eu'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on",
          "X-Forwarded-For" => "$proxy_add_x_forwarded_for",
          "Host" => "$http_host"
        }
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['time_zone'] = 'UTC'

    # If you do NOT need SSH cloning, remove this whole ports block.
    # ports:
    #  - '${GITLAB_SSH_PORT}:22'

    volumes:
      - '${GITLAB_DATA_PATH}/config:/etc/gitlab'
      - '${GITLAB_DATA_PATH}/logs:/var/log/gitlab'
      - '${GITLAB_DATA_PATH}/data:/var/opt/gitlab'

    networks:
      - gitlab-net
      - proxy

    shm_size: '256m'

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.gitlab.rule=Host(`${GITLAB_DOMAIN}`)
      - traefik.http.routers.gitlab.entrypoints=web
      - traefik.http.services.gitlab.loadbalancer.server.port=8080

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    depends_on:
      - gitlab
    volumes:
      - '${DATA_PATH}/runner-config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - gitlab-net

networks:
  gitlab-net:
    driver: bridge
  proxy:
    external: true
    name: proxy