version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION}
    container_name: gitlab
    hostname: ${GITLAB_DOMAIN}
    restart: always
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.vr-worlds.eu'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_https'] = true
        nginx['proxy_set_headers'] = {
          "Host" => "$$http_host",
          "X-Real-IP" => "$$remote_addr",
          "X-Forwarded-For" => "$$proxy_add_x_forwarded_for",
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        gitlab_rails['time_zone'] = '${GITLAB_TIMEZONE}'

        ### --- CONTAINER REGISTRY SETTINGS --- ###
        registry_external_url 'https://registry.vr-worlds.eu'
        gitlab_rails['registry_enabled'] = true
        registry_nginx['listen_port'] = 80
        registry_nginx['listen_https'] = false
        registry_nginx['proxy_set_headers'] = {
          "Host" => "$$http_host",
          "X-Real-IP" => "$$remote_addr",
          "X-Forwarded-For" => "$$proxy_add_x_forwarded_for",
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }

    ports:
      - '${GITLAB_SSH_PORT}:22'

    volumes:
      - '${GITLAB_DATA_PATH}/config:/etc/gitlab'
      - '${GITLAB_DATA_PATH}/logs:/var/log/gitlab'
      - '${GITLAB_DATA_PATH}/data:/var/opt/gitlab'

    shm_size: '256m'

    networks:
      gitlab-net:
        aliases:
          - gitlab
      proxy: {}

    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'

      # --- GitLab UI & Git Router ---
      - 'traefik.http.routers.gitlab.rule=Host(`gitlab.vr-worlds.eu`)'
      - 'traefik.http.routers.gitlab.entrypoints=web'
      - 'traefik.http.routers.gitlab.service=gitlab'
      - 'traefik.http.routers.gitlab.middlewares=gitlab-https-headers@docker'
      - 'traefik.http.services.gitlab.loadbalancer.server.port=80'

      # --- GitLab Container Registry Router ---
      - 'traefik.http.routers.gitlab-registry.rule=Host(`registry.vr-worlds.eu`)'
      - 'traefik.http.routers.gitlab-registry.entrypoints=web'
      - 'traefik.http.routers.gitlab-registry.service=gitlab'
      - 'traefik.http.routers.gitlab-registry.middlewares=gitlab-https-headers@docker'

      # --- Shared Headers Middleware ---
      - 'traefik.http.middlewares.gitlab-https-headers.headers.customrequestheaders.X-Forwarded-Proto=https'
      - 'traefik.http.middlewares.gitlab-https-headers.headers.customrequestheaders.X-Forwarded-Ssl=on'

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    restart: always
    depends_on:
      - gitlab
    volumes:
      - '${GITLAB_DATA_PATH}/runner-config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
    networks:
      - gitlab-net

networks:
  gitlab-net:
    name: gitlab-net
    driver: bridge
  proxy:
    external: true
    name: proxy