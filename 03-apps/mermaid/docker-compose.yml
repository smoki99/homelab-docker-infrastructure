version: "3.8"

networks:
  proxy:
    external: true
    name: proxy

services:
  mermaid:
    image: ghcr.io/mermaid-js/mermaid-live-editor:latest
    container_name: mermaid
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - MERMAID_IS_ENABLED_MERMAID_CHART_LINKS=false
      - MERMAID_ANALYTICS_URL=
      - MERMAID_DOMAIN=
      - MERMAID_RENDERER_URL=
      - MERMAID_KROKI_RENDERER_URL=http://kroki-renderer:8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.mermaid.rule=Host(`mermaid.vr-worlds.eu`)
      - traefik.http.routers.mermaid.entrypoints=web
      - traefik.http.services.mermaid.loadbalancer.server.port=8080
      - traefik.http.routers.mermaid.middlewares=entra-auth@docker

  plantuml-frontend:
    image: hakenadu/plantuml-editor:latest
    container_name: plantuml-frontend
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - BASE_URL=http://kroki-renderer:8000/plantuml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.plantuml.rule=Host(`plantuml.vr-worlds.eu`)
      - traefik.http.routers.plantuml.entrypoints=web
      - traefik.http.services.plantuml.loadbalancer.server.port=8080
      - traefik.http.routers.plantuml.middlewares=entra-auth@docker

  kroki-renderer:
    image: yuzutech/kroki:latest
    container_name: kroki-renderer
    # Highlight-end
    restart: unless-stopped
    environment:
      - KROKI_SAFE_MODE=unsafe
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
