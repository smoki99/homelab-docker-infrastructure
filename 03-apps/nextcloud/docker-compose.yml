name: nextcloud-stack

networks:
  proxy:
    external: true  # Joins the global "proxy" network created by 01-networking
    name: proxy
  internal:
    internal: true  # Private network isolated for Nextcloud DB and Redis

services:
  app:
    container_name: nextcloud-app
    image: nextcloud:latest
    restart: always

    cap_add:
      - SYS_ADMIN
      - MKNOD

    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${NEXTCLOUD_APP_MYSQL_DATABASE}
      - MYSQL_USER=${NEXTCLOUD_APP_MYSQL_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_APP_MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - TRUSTED_PROXIES=172.16.0.0/12
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud.vr-worlds.eu
      - PHP_MEMORY_LIMIT=2048M
    depends_on:
      - db
      - redis
    networks:
      - proxy
      - internal
    volumes:
      - ${NEXTCLOUD_APP_DATASET_HTML}:/var/www/html
      - ${NEXTCLOUD_PAPERLESS_ARCHIVE}:/var/paperless/archive:ro
      - ${NEXTCLOUD_PAPERLESS_CONSUME}:/var/paperless/consume
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.nextcloud.rule=Host(`nextcloud.vr-worlds.eu`) || Host(`nextcloud.vr-worlds.de`)
      - traefik.http.routers.nextcloud.entrypoints=web
      - traefik.http.services.nextcloud.loadbalancer.server.port=80

  eurooffice:
    container_name: nextcloud-eurooffice
    image: ghcr.io/euro-office/documentserver:latest
    restart: always
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - USE_UNAUTHORIZED_STORAGE=true
      - FORCE_SSL=true   
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.eurooffice.rule=Host(`office.vr-worlds.eu`) || Host(`office.vr-worlds.de`)
      - traefik.http.routers.eurooffice.entrypoints=web
      - traefik.http.services.eurooffice.loadbalancer.server.port=80

      # FIX: Force Traefik to explicitly tell EuroOffice that the frontend connection is secure HTTPS
      - traefik.http.routers.eurooffice.middlewares=eurooffice-headers
      - traefik.http.middlewares.eurooffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.eurooffice-headers.headers.customresponseheaders.X-Forwarded-Proto=https
  db:
    container_name: nextcloud-db
    image: mariadb:10.11
    restart: always
    command: '--transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1'
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_APP_MYSQL_PASSWORD}
      - MYSQL_DATABASE=${NEXTCLOUD_APP_MYSQL_DATABASE}
      - MYSQL_USER=${NEXTCLOUD_APP_MYSQL_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_APP_MYSQL_PASSWORD}
    networks:
      - internal
    volumes:
      - ${NEXTCLOUD_APP_DATASET_DB}:/var/lib/mysql:rw

  redis:
    container_name: nextcloud-redis
    image: redis:alpine
    restart: always
    networks:
      - internal
  db-backup:
    container_name: nextcloud-db-backup
    image: fradelg/mysql-cron-backup:latest
    restart: always
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=${NEXTCLOUD_APP_MYSQL_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_APP_MYSQL_PASSWORD}
      - MYSQL_DATABASE=${NEXTCLOUD_APP_MYSQL_DATABASE}
      - CRON_SCHEDULE=0 */12 * * * 
      - BACKUP_NUM_KEEP=25
      - GZIP_LEVEL=6  
    volumes:
      - ${NEXTCLOUD_APP_DATASET_DB_BACKUP}:/backup
    networks:
      - internal
    depends_on:
      - db