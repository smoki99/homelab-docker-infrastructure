name: customer-portal-stack

networks:
  proxy:
    external: true
    name: proxy
  portal-backend:
    driver: bridge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    networks:
      - portal-backend

  api:
    image: registry.vr-worlds.eu/smoki/customer-portal-v2/backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PORTAL_DB_URL: 'jdbc:postgresql://postgres:5432/customer_portal'
      PORTAL_DB_USER: portal
      PORTAL_DB_PASSWORD: portal
    expose:
      - '4001'
    networks:
      - portal-backend

  web:
    image: registry.vr-worlds.eu/smoki/customer-portal-v2/web:latest
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - proxy
      - portal-backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.customer-portal.rule=Host(`cupo-demo1.vr-worlds.eu`)
      - traefik.http.routers.customer-portal.entrypoints=web
      - traefik.http.services.customer-portal.loadbalancer.server.port=80
      - traefik.http.routers.customer-portal.middlewares=portal-headers
      - traefik.http.middlewares.portal-headers.headers.customrequestheaders.X-Forwarded-Proto=https

volumes:
  portal_pgdata: