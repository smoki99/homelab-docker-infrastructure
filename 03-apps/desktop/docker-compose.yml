name: desktop-stack

networks:
  proxy:
    external: true
    name: proxy

services:
  desktop:
    container_name: linux-desktop
    # 🎯 SWITCH TO PURE noVNC HTML5 DESKTOP:
    image: lscr.io/linuxserver/rdesktop:ubuntu-xfce
    restart: always
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    networks:
      - proxy
    volumes:
      - ${DESKTOP_APP_DATASET_CONFIG}:/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.webtop.rule=Host(`desktop.vr-worlds.eu`)
      - traefik.http.routers.webtop.entrypoints=web
      - traefik.http.services.webtop.loadbalancer.server.port=3000

      # 🔒 Microsoft Entra ID SSO Protection
      - traefik.http.routers.webtop.middlewares=entra-auth@docker