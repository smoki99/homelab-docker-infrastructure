version: "3.8"

networks:
  proxy:
    external: true
    name: proxy
services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "127.0.0.1:9898:9898"
    environment:
      - BACKREST_PORT=9898
    volumes:
      - /mnt/fast-data-pool-02/apps-fast/backrest/config:/config
      - /mnt/fast-data-pool-02/apps-fast/backrest/cache:/cache

      - /root/.ssh/hetzner_storagebox:/root/.ssh/hetzner_storagebox:ro

      - /mnt/fast-data-pool-02/apps-fast/paperless:/data/paperless-nvme:ro
      - /mnt/slow-data-pool-1/apps/paperless:/data/paperless-hdd:ro
      
      # Mount ALL TrueNAS Pools (Read-Only)
      - type: bind
        source: /mnt/fast-data-pool-01
        target: /data/fast-pool-01
        read_only: true
        bind:
          propagation: rslave

      - type: bind
        source: /mnt/fast-data-pool-02
        target: /data/fast-pool-02
        read_only: true
        bind:
          propagation: rslave

      - type: bind
        source: /mnt/slow-data-pool-1
        target: /data/slow-pool-1
        read_only: true
        bind:
          propagation: rslave

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.backrest.rule=Host(`backrest.vr-worlds.eu`)
      - traefik.http.routers.backrest.entrypoints=web
      - traefik.http.routers.backrest.service=backrest-svc
      - traefik.http.services.backrest-svc.loadbalancer.server.port=9898