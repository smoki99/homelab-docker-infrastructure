name: networking-stack

networks:
  proxy:
    name: proxy

services:
  traefik:
    container_name: traefik
    image: traefik:v3.0
    restart: always
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--api.dashboard=true'
      - '--api.insecure=true'
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.vr-worlds.eu`)
      - traefik.http.routers.traefik-dashboard.entrypoints=web
      - traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080
      - traefik.http.routers.traefik-dashboard.middlewares=entra-auth@docker

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_API_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - proxy

  truenas:
    container_name: truenas
    image: alpine:latest
    command: ["sh", "-c", "sleep infinity"]
    restart: always
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.truenas.rule=Host(${TRUENAS_HOST})
      - traefik.http.routers.truenas.entrypoints=web
      - traefik.http.routers.truenas.middlewares=entra-auth@docker
      - traefik.http.services.truenas.loadbalancer.server.url=${TRUENAS_UPSTREAM_URL}

  # Microsoft Entra ID Authentication Gateway
  oauth2-proxy:
    container_name: oauth2-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: always
    environment:
      # OIDC Settings for Microsoft Entra External ID (CIAM)
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_PROVIDER_DISPLAY_NAME="Microsoft External Login"
      - OAUTH2_PROXY_CLIENT_ID=${ENTRA_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://vrworldsexternal.ciamlogin.com/${ENTRA_TENANT_ID}/v2.0
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=sub
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true
      
      # Settings
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_DOMAINS=.vr-worlds.eu
      - OAUTH2_PROXY_WHITELIST_DOMAINS=.vr-worlds.eu
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.vr-worlds.eu/oauth2/callback
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.oauth2-proxy.rule=Host(`auth.vr-worlds.eu`)
      - traefik.http.routers.oauth2-proxy.entrypoints=web
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180

      - traefik.http.middlewares.entra-auth.forwardauth.address=http://oauth2-proxy:4180/
      - traefik.http.middlewares.entra-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.entra-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email
